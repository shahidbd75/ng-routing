<!-- Top Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top admin-navbar">
  <div class="container-fluid">
    <!-- Sidebar Toggle Button -->
    <button class="btn btn-outline-light me-3 d-lg-none" type="button" (click)="toggleSidebar()"
      aria-label="Toggle sidebar">
      <i class="bi bi-list"></i>
    </button>

    <!-- Brand/Logo -->
    <a class="navbar-brand" href="#">
      <i class="bi bi-shield-check me-2"></i>Admin Panel
    </a>

    <!-- Spacer -->
    <div class="flex-grow-1"></div>

    <!-- Right side actions -->
    <div class="d-flex align-items-center">
      <!-- Login Button (if not logged in) -->
      <a *ngIf="!currentUser" class="btn btn-outline-light me-2" routerLink="/login">
        <i class="bi bi-box-arrow-in-right me-1"></i>Login
      </a>

      <!-- Profile Dropdown (if logged in) -->
      <div class="dropdown" *ngIf="currentUser">
        <button class="btn btn-outline-light dropdown-toggle" type="button" id="profileDropdown"
          data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-person-circle me-2"></i>
          {{ currentUser.name }}
        </button>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
          <li>
            <a class="dropdown-item" href="#">
              <i class="bi bi-person me-2"></i>Profile
            </a>
          </li>
          <li>
            <a class="dropdown-item" routerLink="settings" routerLinkActive="active">
              <i class="bi bi-gear me-2"></i>Settings
            </a>
          </li>
          <li>
            <hr class="dropdown-divider" />
          </li>
          <li>
            <a class="dropdown-item text-danger" href="#" (click)="logout(); $event.preventDefault()">
              <i class="bi bi-box-arrow-right me-2"></i>Logout
            </a>
          </li>
        </ul>
        </div>
        </div>
        </div>
        </nav>
        
        <!-- Main Container with Sidebar and Content -->
        <div class="container-fluid admin-container">
          <div class="row">
            <!-- Sidebar Navigation -->
            <aside class="col-md-3 col-lg-2 px-0 sidebar" [class.show]="sidebarOpen" id="sidebar">
              <div class="sidebar-sticky">
                <nav class="nav flex-column sidebar-nav">
                  <a class="nav-link" [routerLink]="['home']" routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: true }" (click)="onNavLinkClick()">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                  </a>
                  <a class="nav-link" [routerLink]="['products']" routerLinkActive="active" (click)="onNavLinkClick()">
                    <i class="bi bi-box-seam me-2"></i>Products
                  </a>
                  <a class="nav-link" [routerLink]="['supplier']" routerLinkActive="active" (click)="onNavLinkClick()">
                    <i class="bi bi-truck me-2"></i>Supplier
                  </a>
                  <a class="nav-link" [routerLink]="['delivery']" routerLinkActive="active" (click)="onNavLinkClick()">
                    <i class="bi bi-shop me-2"></i>Delivery
                  </a>
            </nav>
      </div>
      </aside>

    <!-- Main Content Area -->
    <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 main-content">
      <div class="content-wrapper">
        <router-outlet></router-outlet>
      </div>
      </main>
      </div>
      </div>

<!-- Backdrop for mobile sidebar -->
<div class="sidebar-backdrop" [class.show]="sidebarOpen && isMobile" (click)="toggleSidebar()"></div>
